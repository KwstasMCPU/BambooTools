# This workflow will build and test the BambooTools package when a push is made. It will
# only publish to PyPi if a new tag is found

name: Publish and test Python package to PyPi

on: push

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -

    - name: Install dependencies
      run: poetry install

    - name: Test with pytest
      run: |
        poetry run pytest

    - name: Build package
      run: |
        poetry build

    - name: Publish package
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: poetry publish --username $TWINE_USERNAME --password $TWINE_PASSWORD
